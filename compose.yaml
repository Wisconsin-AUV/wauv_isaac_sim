# Editor (GUI over WebRTC):   docker compose up -d sim ros
# Run the sim script:         docker compose --profile run up sim-run
# Shell in ROS:               docker compose exec ros bash

x-common: &common
  network_mode: host      # DDS, ZED stream, WebRTC, SITL UDP: no NAT
  ipc: host               # Fast DDS shared memory + ZED IPC stream across containers
  deploy:
    resources:
      reservations:
        devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

x-sim: &sim
  <<: *common
  build: { context: ., dockerfile: docker/sim.dockerfile }
  image: wauv-isaac-sim
  environment:
    - NVIDIA_DRIVER_CAPABILITIES=all
    - OMNI_KIT_ALLOW_ROOT=1
    - ACCEPT_EULA=Y
    - PRIVACY_CONSENT=Y
    - PYTHONPATH=/wauv                       # `import wauv_sim` works
    - ROS_DISTRO=jazzy                       # Isaac's internal ROS 2 bridge
    - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
    - ROS_DOMAIN_ID=0
    - PYTHONUNBUFFERED=1
  volumes:
    - ./extern/zed-isaac-sim:/isaac-sim/extsUser/zed-isaac-sim   # your fork (submodule)
    - ./wauv_sim:/wauv/wauv_sim                                  # sim code
    - ./run_sub.py:/wauv/run_sub.py
    - ./config:/wauv/config
    - ./assets:/assets                                           # USDs
    - isaac-cache:/isaac-sim/kit/cache                           # shader cache
    - isaac-ov-cache:/root/.cache/ov

services:
  sim:                       # EDITOR: Isaac GUI over WebRTC, for building scenes
    <<: *sim

  sim-run:                   # RUNTIME: your script owns the loop (lock-step with SITL)
    <<: *sim
    profiles: ["run"]        # only starts when you ask for it
    entrypoint:
      - /bin/bash
      - -c
      - |
        export LD_LIBRARY_PATH="$${LD_LIBRARY_PATH}:/isaac-sim/exts/isaacsim.ros2.core/jazzy/lib"
        exec ./python.sh /wauv/run_sub.py

  ros:
    <<: *common
    build: { context: ., dockerfile: docker/ros.dockerfile }
    image: wauv-ros-humble
    stdin_open: true
    tty: true
    environment:
      - NVIDIA_DRIVER_CAPABILITIES=all
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
    volumes:
      - ../WAUV_autonomous_deployment:/workspace   # your sub code, as a sibling repo

volumes:
  isaac-cache:
  isaac-ov-cache:
